# Prometheus scrape config (Day 13, ADR-040). Scrapes the OTEL Collector's Prometheus exporter — the
# Collector already aggregated OTLP metrics from all 5 services, so one scrape target covers the fleet.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Self-scrape so prometheus_tsdb_head_series is available — that's the gauge the cardinality-blowup
  # demo watches climb when order_id is (mis)used as a metric label (ADR-042).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
