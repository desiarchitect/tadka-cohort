# Grafana datasources (Day 13, ADR-040). Prometheus for aggregate metrics, Jaeger for traces.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: tadka-prometheus

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: tadka-jaeger
