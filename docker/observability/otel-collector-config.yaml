# OTEL Collector config (Day 13, ADR-040) — the vendor-neutral routing seam.
# Receives OTLP from all 5 Tadka services, batches, and fans out: traces → Jaeger, metrics → Prometheus.
# To move to Datadog/Grafana-Cloud tomorrow you change THIS file, not a line of app code.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Traces → Jaeger (OTLP gRPC, in-network).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics → a Prometheus scrape endpoint the prometheus container pulls from (:8889).
  prometheus:
    endpoint: 0.0.0.0:8889
    # Promote resource attributes (service.name → service_name) onto each series so dashboards can group
    # per service. Safe here: 5 services = low cardinality (ADR-042 — the discipline is about ids, not service).
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
