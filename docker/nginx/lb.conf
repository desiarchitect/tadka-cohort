# Day 6 scale-out beat (ADR-047): 3 explicit monolith replicas, not `docker compose --scale`,
# so nginx's health-check eviction (max_fails/fail_timeout) has stable, known backend addresses
# to track — that's what makes "kill one, watch it get evicted, watch it rejoin" demoable.

upstream tadka_api {
    least_conn;
    server api-1:8080 max_fails=2 fail_timeout=5s;
    server api-2:8080 max_fails=2 fail_timeout=5s;
    server api-3:8080 max_fails=2 fail_timeout=5s;
}

# Day 6, Beat (CDN emulation, ADR-049): edge cache. Day 6 has no static asset serving yet (that's
# Tadka.Gateway's wwwroot, Day 11) — a "CDN" ahead of a load balancer more honestly emulates by
# caching the API responses themselves, which is exactly what a real edge cache (Varnish,
# CloudFront-in-front-of-an-API) does. 30s TTL — short enough to demo the "stale after update"
# window inside a class session without waiting minutes.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tadka_edge:10m max_size=100m inactive=5m use_temp_path=off;

server {
    listen 80;

    location /api/v1/restaurants {
        proxy_pass http://tadka_api;
        proxy_http_version 1.1;
        # $http_host, not $host: nginx's $host strips the port from the original request's Host
        # header. That silently broke signed-URL generation (ADR-050) - the app builds absolute
        # URLs from Request.Host, and a port-less Host made it construct a URL pointing at :80,
        # which nothing listens on. $http_host preserves the client's original "host:port" as-is.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # The edge cache does NOT know about the app's own ETag/If-None-Match (ADR-048) — it
        # caches the raw response for its own TTL, independent of what the origin says. That
        # mismatch (two caches, two invalidation stories) is the point of this beat: updating a
        # menu price invalidates the app's Redis cache (ADR-018) immediately, but the EDGE cache
        # keeps serving its own stale copy until this TTL expires, regardless.
        proxy_cache tadka_edge;
        proxy_cache_valid 200 30s;
        proxy_cache_key "$request_uri";
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://tadka_api;
        proxy_http_version 1.1;
        # $http_host, not $host: nginx's $host strips the port from the original request's Host
        # header. That silently broke signed-URL generation (ADR-050) - the app builds absolute
        # URLs from Request.Host, and a port-less Host made it construct a URL pointing at :80,
        # which nothing listens on. $http_host preserves the client's original "host:port" as-is.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # A dead replica should fail FAST, not hang the request for nginx's full timeout —
        # otherwise "requests survive" would be true but slow, which undersells the demo.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
