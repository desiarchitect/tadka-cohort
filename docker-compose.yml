# Tadka - Docker Compose
# Phase 0: PostgreSQL only
# Day 5: + PostgreSQL streaming read replica (ADR-016)
# Day 6: + Redis (cache-aside + stampede lock + live-tracking pub/sub backplane — ADR-018/019/020)
#         + `scale-out` profile (3 monolith replicas + nginx LB, ADR-047): `docker compose --profile scale-out up`
# Day 8: Add Kafka + Zookeeper (first service extraction)
# Day 13: Add Prometheus + Grafana

services:
  # Primary — all writes, plus reads that must be fresh (read-your-writes).
  postgres:
    image: postgres:16
    container_name: tadka-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${POSTGRES_DB:-tadka}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    # Enable streaming replication (WAL senders + a slot) so the replica can follow.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a fresh cluster: creates the replication role + pg_hba entry.
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Read replica (Day 5) — clones the primary via pg_basebackup on first boot, then streams.
  # The API routes read-heavy GETs here (restaurant list, menu, order history).
  postgres-replica:
    image: postgres:16
    container_name: tadka-postgres-replica
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./docker/replica-entrypoint.sh:/replica-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis (Day 6) — menu cache (cache-aside + single-flight lock) and the live-tracking
  # pub/sub backplane. Cache is disposable, so no persistent volume.
  redis:
    image: redis:7-alpine
    container_name: tadka-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- scale-out profile (Day 6, ADR-047) -----------------------------------
  # `docker compose --profile scale-out up -d` — 3 monolith replicas + nginx LB in front.
  # Not started by a plain `docker compose up` (no profile = infra-only, unchanged from before).
  # 3 EXPLICIT services (not `--scale`) so nginx has stable hostnames for max_fails/fail_timeout
  # health-check eviction to track — that's what makes "kill one, watch it evicted" demoable.
  api-1:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-1
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-2
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-3
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx-lb:
    image: nginx:alpine
    container_name: tadka-nginx-lb
    profiles: ["scale-out"]
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_replica:
