# Tadka - Docker Compose
# Phase 0: PostgreSQL only
# Day 5: + PostgreSQL streaming read replica (ADR-016)
# Day 6: + Redis (cache-aside + stampede lock + live-tracking pub/sub backplane — ADR-018/019/020)
# Day 8: Add Kafka + Zookeeper (first service extraction)
# Day 11: + PgBouncer (ADR-015 landed — multi-instance connection pooling)
# Day 13: Add Prometheus + Grafana

services:
  # Primary — all writes, plus reads that must be fresh (read-your-writes).
  postgres:
    image: postgres:16
    container_name: tadka-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${POSTGRES_DB:-tadka}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    # Enable streaming replication (WAL senders + a slot) so the replica can follow.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a fresh cluster: creates the replication role + pg_hba entry.
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Read replica (Day 5) — clones the primary via pg_basebackup on first boot, then streams.
  # The API routes read-heavy GETs here (restaurant list, menu, order history).
  postgres-replica:
    image: postgres:16
    container_name: tadka-postgres-replica
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./docker/replica-entrypoint.sh:/replica-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis (Day 6) — menu cache (cache-aside + single-flight lock) and the live-tracking
  # pub/sub backplane. Cache is disposable, so no persistent volume.
  redis:
    image: redis:7-alpine
    container_name: tadka-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Payment service database (Day 8) — database-per-service (ADR-026). The extracted Tadka.Payment.Api
  # owns this PostgreSQL; nothing else connects to it. Kill it and the monolith (its own DB) is unaffected.
  # The apps still run via `dotnet run` (no Dockerfile); compose only provides the infrastructure.
  payment-db:
    image: postgres:16
    container_name: tadka-payment-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${PAYMENT_DB:-tadka_payment}
    volumes:
      - pgdata_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Delivery service database (Day 11) — database-per-service (ADR-033). Own PostgreSQL for the 3rd service.
  delivery-db:
    image: postgres:16
    container_name: tadka-delivery-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${DELIVERY_DB:-tadka_delivery}
    volumes:
      - pgdata_delivery:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka (Day 9) — the async event backbone (ADR-027). Single-node KRaft (no Zookeeper).
  # Two listeners: HOST (localhost:9092) for the apps you run via `dotnet run`, and DOCKER
  # (kafka:29092) for in-network containers like the UI. Topics auto-create for cohort convenience.
  # SASL/SCRAM-SHA-256 auth on HOST and DOCKER (day-09 security fix) — CONTROLLER stays PLAINTEXT,
  # it's KRaft-internal quorum traffic, single-voter, never reachable outside the container.
  # The vanilla image can't seed SCRAM credentials on its own, so `command:` overrides its default
  # entrypoint with a script that formats storage with --add-scram before starting the broker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: tadka-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "Nk3n3ZQoDvCMFvVeoTt5wQ"
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-tadka_kafka_local}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:SASL_PLAINTEXT,DOCKER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_HOST_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="tadka" password="${KAFKA_SASL_PASSWORD:-tadka_kafka_local}";'
      KAFKA_LISTENER_NAME_DOCKER_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="tadka" password="${KAFKA_SASL_PASSWORD:-tadka_kafka_local}";'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    command: ["bash", "/etc/kafka/docker/tadka-scram-entrypoint.sh"]
    volumes:
      - ./docker/kafka-scram-entrypoint.sh:/etc/kafka/docker/tadka-scram-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/docker/client.properties --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # Kafka UI (Day 9) — watch topics, partitions, consumer-group LAG live (the catch-up demo).
  # SASL/SCRAM credentials match the broker's (day-09 security fix) — without these the UI can't connect.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: tadka-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: tadka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="tadka" password="${KAFKA_SASL_PASSWORD:-tadka_kafka_local}";'
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  # PgBouncer (Day 11, ADR-015 landed) — transaction-mode pooler in front of the primary.
  # Day 5 showed one app instance can't truly exhaust a 10-pool; Day 11 is the first day with
  # 2+ Tadka.Api instances, so this is where the promised multi-instance demo lands.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tadka-pgbouncer
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tadka}:${POSTGRES_PASSWORD:-tadka_local}@postgres:5432/${POSTGRES_DB:-tadka}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:-tadka}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_replica:
  pgdata_payment:
  pgdata_delivery:
