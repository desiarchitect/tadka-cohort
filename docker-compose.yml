# Tadka - Docker Compose
# Phase 0: PostgreSQL only
# Day 5: + PostgreSQL streaming read replica (ADR-016)
# Day 6: + Redis (cache-aside + stampede lock + live-tracking pub/sub backplane — ADR-018/019/020)
#         + `scale-out` profile (3 monolith replicas + nginx LB, ADR-047): `docker compose --profile scale-out up`
# Day 8: Add Kafka + Zookeeper (first service extraction)
# Day 13: + observability stack (OTEL Collector + Jaeger + Prometheus + Grafana) behind the `observability`
#         compose PROFILE — off by default to keep the Week-7 RAM tier sane. Bring it up with:
#           docker compose up -d                          # core only (DBs, Redis, Kafka)
#           docker compose --profile observability up -d  # + collector/jaeger/prometheus/grafana
#         Then export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 before `dotnet run` (ADR-040).

services:
  # Primary — all writes, plus reads that must be fresh (read-your-writes).
  postgres:
    image: postgres:16
    container_name: tadka-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${POSTGRES_DB:-tadka}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    # Enable streaming replication (WAL senders + a slot) so the replica can follow.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a fresh cluster: creates the replication role + pg_hba entry.
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Read replica (Day 5) — clones the primary via pg_basebackup on first boot, then streams.
  # The API routes read-heavy GETs here (restaurant list, menu, order history).
  postgres-replica:
    image: postgres:16
    container_name: tadka-postgres-replica
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator_pass}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./docker/replica-entrypoint.sh:/replica-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis (Day 6) — menu cache (cache-aside + single-flight lock) and the live-tracking
  # pub/sub backplane. Cache is disposable, so no persistent volume.
  redis:
    image: redis:7-alpine
    container_name: tadka-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Payment service database (Day 8) — database-per-service (ADR-026). The extracted Tadka.Payment.Api
  # owns this PostgreSQL; nothing else connects to it. Kill it and the monolith (its own DB) is unaffected.
  # The apps still run via `dotnet run` (no Dockerfile); compose only provides the infrastructure.
  payment-db:
    image: postgres:16
    container_name: tadka-payment-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${PAYMENT_DB:-tadka_payment}
    volumes:
      - pgdata_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Delivery service database (Day 11) — database-per-service (ADR-033). Own PostgreSQL for the 3rd service.
  delivery-db:
    image: postgres:16
    container_name: tadka-delivery-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${DELIVERY_DB:-tadka_delivery}
    volumes:
      - pgdata_delivery:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Restaurant service database (Day 12) — database-per-service (ADR-036/026). Own PostgreSQL for the 4th
  # service. The monolith no longer owns the restaurant schema; it keeps a local read replica (ADR-037)
  # in its own `ordering` schema, fed by this service's menu-updated events.
  restaurant-db:
    image: postgres:16
    container_name: tadka-restaurant-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadka_local}
      POSTGRES_DB: ${RESTAURANT_DB:-tadka_restaurant}
    volumes:
      - pgdata_restaurant:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka (Day 9) — the async event backbone (ADR-027). Single-node KRaft (no Zookeeper).
  # Two listeners: HOST (localhost:9092) for the apps you run via `dotnet run`, and DOCKER
  # (kafka:29092) for in-network containers like the UI. Topics auto-create for cohort convenience.
  kafka:
    image: apache/kafka:3.8.0
    container_name: tadka-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # Kafka UI (Day 9) — watch topics, partitions, consumer-group LAG live (the catch-up demo).
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: tadka-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: tadka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  # ── Observability stack (Day 13, ADR-040) — PROFILE: observability (opt-in) ──────────────────────────
  # Instrument once with OpenTelemetry, export OTLP to the Collector, which fans out to Jaeger (traces) +
  # Prometheus (metrics); Grafana sits on top. The Collector is the vendor-neutral SEAM: swap Jaeger for
  # Datadog by changing the Collector config, not the app. Apps run on the HOST via `dotnet run` and push
  # OTLP to localhost:4317 (published below).

  # OTEL Collector — the single OTLP sink. Receives traces+metrics from all 5 services, routes them.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: tadka-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC  (apps export here: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint (the Collector's metrics exporter)
    depends_on:
      - jaeger
    restart: unless-stopped

  # Jaeger — distributed-tracing backend + UI. Accepts OTLP from the Collector (in-network on 4317).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: tadka-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI — the saga-in-one-trace waterfall
    restart: unless-stopped

  # Prometheus — metrics TSDB. Scrapes the Collector's :8889 endpoint (both in-network, no host hop).
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: tadka-prometheus
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI (run PromQL; check /tsdb-status for the cardinality demo)
    depends_on:
      - otel-collector
    restart: unless-stopped

  # Grafana — dashboards over Prometheus + Jaeger; ships a provisioned System-Overview RED dashboard + one alert.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: tadka-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # cohort convenience — no login wall for the demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"     # Grafana UI (admin/admin)
    depends_on:
      - prometheus

  # --- scale-out profile (Day 6, ADR-047) -----------------------------------
  # `docker compose --profile scale-out up -d` — 3 monolith replicas + nginx LB in front.
  # Not started by a plain `docker compose up` (no profile = infra-only, unchanged from before).
  # 3 EXPLICIT services (not `--scale`) so nginx has stable hostnames for max_fails/fail_timeout
  # health-check eviction to track — that's what makes "kill one, watch it evicted" demoable.
  api-1:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-1
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-2
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build:
      context: .
      dockerfile: src/Tadka.Api/Dockerfile
    profiles: ["scale-out"]
    environment:
      INSTANCE_NAME: api-3
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TadkaDb: "Host=postgres;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Minimum Pool Size=5;Maximum Pool Size=50"
      ConnectionStrings__TadkaDbReplica: "Host=postgres-replica;Port=5432;Database=tadka;Username=tadka;Password=tadka_local;Maximum Pool Size=50"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx-lb:
    image: nginx:alpine
    container_name: tadka-nginx-lb
    profiles: ["scale-out"]
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_replica:
  pgdata_payment:
  pgdata_delivery:
  pgdata_restaurant:
