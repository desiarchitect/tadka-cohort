# Toy only. Not Tadka's compose. Standalone Redis HA lab:
#   replica  = copy, not failover
#   cluster  = 16384 slots, sharding, not HA (0 replicas)
#   sentinel = actual failover (promotes the replica)
#
#   docker compose -f toydemo/day-07-redis-ha/docker-compose.yml up -d
#   See README.md for the class script.

name: tadka-redis-ha

services:
  redis-master:
    image: redis:7-alpine
    container_name: tadka-ha-master
    command: redis-server --port 6379
    ports:
      - "6380:6379"

  redis-replica:
    image: redis:7-alpine
    container_name: tadka-ha-replica
    command: redis-server --port 6379 --replicaof redis-master 6379
    ports:
      - "6381:6379"
    depends_on:
      - redis-master

  sentinel:
    image: redis:7-alpine
    container_name: tadka-ha-sentinel
    command: sh -c "cp /sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel.conf:/sentinel.conf:ro
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica

  redis-c1:
    image: redis:7-alpine
    container_name: tadka-redis-c1
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip redis-c1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7001:6379"
      - "17001:16379"

  redis-c2:
    image: redis:7-alpine
    container_name: tadka-redis-c2
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip redis-c2
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7002:6379"
      - "17002:16379"

  redis-c3:
    image: redis:7-alpine
    container_name: tadka-redis-c3
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip redis-c3
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7003:6379"
      - "17003:16379"

  cluster-init:
    image: redis:7-alpine
    container_name: tadka-redis-c-init
    depends_on:
      - redis-c1
      - redis-c2
      - redis-c3
    restart: "no"
    command: >
      sh -c "sleep 4 &&
      redis-cli --cluster create redis-c1:6379 redis-c2:6379 redis-c3:6379
      --cluster-replicas 0 --cluster-yes"
