# Toy only. Not Tadka's compose.
# Static IPs on a dedicated network: Redis 7 rejects hostname for cluster-announce-ip,
# and Sentinel + Docker DNS NXDOMAIN on a stopped master puts Sentinel in TILT.
#
#   docker compose -f toydemo/day-07-redis-ha/docker-compose.yml up -d
#   See README.md.

name: tadka-redis-ha

networks:
  ha:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  redis-master:
    image: redis:7-alpine
    container_name: tadka-ha-master
    command: redis-server --port 6379
    ports:
      - "6380:6379"
    networks:
      ha:
        ipv4_address: 172.28.0.10

  redis-replica:
    image: redis:7-alpine
    container_name: tadka-ha-replica
    command: redis-server --port 6379 --replicaof 172.28.0.10 6379
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    networks:
      ha:
        ipv4_address: 172.28.0.11

  sentinel:
    image: redis:7-alpine
    container_name: tadka-ha-sentinel
    command: sh -c "cp /sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel.conf:/sentinel.conf:ro
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica
    networks:
      ha:
        ipv4_address: 172.28.0.12

  redis-c1:
    image: redis:7-alpine
    container_name: tadka-redis-c1
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 172.28.0.21
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      ha:
        ipv4_address: 172.28.0.21

  redis-c2:
    image: redis:7-alpine
    container_name: tadka-redis-c2
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 172.28.0.22
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      ha:
        ipv4_address: 172.28.0.22

  redis-c3:
    image: redis:7-alpine
    container_name: tadka-redis-c3
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 172.28.0.23
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "7003:6379"
      - "17003:16379"
    networks:
      ha:
        ipv4_address: 172.28.0.23

  cluster-init:
    image: redis:7-alpine
    container_name: tadka-redis-c-init
    depends_on:
      - redis-c1
      - redis-c2
      - redis-c3
    restart: "no"
    networks:
      ha:
        ipv4_address: 172.28.0.24
    command:
      - sh
      - -c
      - |
        i=0
        while [ $$i -lt 30 ]; do
          redis-cli -h 172.28.0.21 ping >/dev/null 2>&1 &&
          redis-cli -h 172.28.0.22 ping >/dev/null 2>&1 &&
          redis-cli -h 172.28.0.23 ping >/dev/null 2>&1 && break
          i=$$((i+1))
          sleep 1
        done
        redis-cli --cluster create 172.28.0.21:6379 172.28.0.22:6379 172.28.0.23:6379 --cluster-replicas 0 --cluster-yes
