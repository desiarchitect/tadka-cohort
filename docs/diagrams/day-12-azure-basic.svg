<svg viewBox="0 0 1180 848" xmlns="http://www.w3.org/2000/svg" width="1180" height="848" role="img"><title>Tadka on Azure, basic mode</title><style>
svg{--plate:#ffffff;--fg:#17211c;--muted:#56655d;--line:#8d9a93;--edge:#5b45c9;--edge-bg:#eeeafd;--app:#0d7457;--app-bg:#e1f3ea;--data:#1d5ca8;--data-bg:#e5eefa;--ops:#6f6238;--ops-bg:#f2eedf;--gov:#59636b;--gov-bg:#eceff1;--ha:#c25f00;--ha-bg:#fff1e0}
@media (prefers-color-scheme: dark){svg{--plate:#18201b;--fg:#e3ebe6;--muted:#9db0a5;--line:#74867c;--edge:#b4a6ff;--edge-bg:#26213f;--app:#6fd6ae;--app-bg:#14302a;--data:#8dbcf5;--data-bg:#172840;--ops:#d9c98f;--ops-bg:#2d2a1b;--gov:#b6c0c7;--gov-bg:#252b2f;--ha:#ffad5c;--ha-bg:#3a2610}}
.bg{fill:var(--plate)}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.tt{font-size:13px;font-weight:600;fill:var(--fg)}.ts{font-size:11.5px;fill:var(--muted)}
.tl{font:500 12px "IBM Plex Mono",Consolas,monospace;fill:var(--muted)}.ta{font-size:11px;fill:var(--muted);font-style:italic}
.ct{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 4}.ct.edge{stroke:var(--edge)}.ct.app{stroke:var(--app)}.ct.data{stroke:var(--data)}
.bx rect{stroke-width:1.2}.ext rect{fill:var(--plate);stroke:var(--line)}.edge rect{fill:var(--edge-bg);stroke:var(--edge)}
.app rect{fill:var(--app-bg);stroke:var(--app)}.data rect{fill:var(--data-bg);stroke:var(--data)}.ops rect{fill:var(--ops-bg);stroke:var(--ops)}
.gov rect{fill:var(--gov-bg);stroke:var(--gov)}.ha rect{stroke:var(--ha);stroke-width:2.4}.opt rect{stroke-dasharray:4 3}
.ar{fill:none;stroke:var(--line);stroke-width:1.3}.ar.dash{stroke-dasharray:5 4}.ar.hot{stroke:var(--ha)}.ah{fill:var(--line)}.ah.hot{fill:var(--ha)}
</style><rect class="bg" width="100%" height="100%"/><g class="bx ext"><rect x="60" y="30" width="220" height="56" rx="6"/><text class="tt" x="72" y="53">Students' browsers</text><text class="ts" x="72" y="71">HTTPS to *.azurefd.net</text></g><g class="bx ext"><rect x="300" y="30" width="220" height="56" rx="6"/><text class="tt" x="312" y="53">k6 load test</text><text class="ts" x="312" y="71">Day 16, same Front Door URL</text></g><g class="bx ext"><rect x="900" y="30" width="240" height="56" rx="6"/><text class="tt" x="912" y="53">GitHub Container Registry</text><text class="ts" x="912" y="71">5 images, outside Azure</text></g><rect class="ct edge" x="40" y="122" width="720" height="118" rx="10"/><text class="tl" x="54" y="142">Azure Front Door Standard · afd-tadka · global edge</text><g class="bx edge"><rect x="55" y="160" width="160" height="56" rx="6"/><text class="tt" x="67" y="183">Endpoint</text><text class="ts" x="67" y="201">*.azurefd.net · TLS</text></g><g class="bx edge"><rect x="230" y="160" width="160" height="56" rx="6"/><text class="tt" x="242" y="183">WAF policy</text><text class="ts" x="242" y="201">3,000 req/min per IP</text></g><g class="bx edge"><rect x="405" y="160" width="160" height="56" rx="6"/><text class="tt" x="417" y="183">Cache rule</text><text class="ts" x="417" y="201">restaurants* · 30 s</text></g><g class="bx edge"><rect x="580" y="160" width="160" height="56" rx="6"/><text class="tt" x="592" y="183">Origin group</text><text class="ts" x="592" y="201">gateway · HTTPS only</text></g><path class="ar" d="M170 86 L170 106 L135 106 L135 160"/><polygon class="ah" points="135,160 130.5,152 139.5,152"/><path class="ar" d="M410 86 L410 106 L170 106"/><text class="ta" x="420" y="104">all API calls</text><path class="ar dash" d="M900 58 L820 58 L820 334"/><polygon class="ah" points="820,334 815.5,326 824.5,326"/><text class="ta" x="828" y="150">image pull</text><rect class="ct " x="20" y="268" width="1140" height="556" rx="10"/><text class="tl" x="34" y="288">Resource group rg-tadka-session · Central India</text><rect class="ct " x="40" y="300" width="820" height="504" rx="10"/><text class="tl" x="54" y="320">vnet-tadka · 10.40.0.0/16</text><rect class="ct app" x="60" y="334" width="780" height="322" rx="10"/><text class="tl" x="74" y="354">snet-container-apps · 10.40.0.0/23 · Container Apps environment cae-tadka</text><text class="ts" x="74" y="371">Consumption profile · built-in Envoy ingress balances every app</text><path class="ar" d="M660 216 L660 385"/><polygon class="ah" points="660,385 655.5,377 664.5,377"/><text class="ta" x="488" y="258">HTTPS + X-Azure-FDID header</text><path class="ar dash" d="M60 58 L30 58 L30 413 L520 413"/><polygon class="ah" points="520,413 512,408.5 512,417.5"/><text class="ta" x="90" y="405">SSE live tracking connects to the gateway URL directly (no CDN)</text><g class="bx app"><rect x="520" y="385" width="240" height="56" rx="6"/><text class="tt" x="532" y="408">gateway · YARP</text><text class="ts" x="532" y="426">only public ingress · 1 to 5</text></g><path class="ar" d="M640 441 L640 462"/><path class="ar" d="M167.5 462 L737.5 462"/><path class="ar" d="M167.5 462 L167.5 485"/><polygon class="ah" points="167.5,485 163,477 172,477"/><path class="ar" d="M357.5 462 L357.5 485"/><polygon class="ah" points="357.5,485 353,477 362,477"/><path class="ar" d="M547.5 462 L547.5 485"/><polygon class="ah" points="547.5,485 543,477 552,477"/><path class="ar" d="M737.5 462 L737.5 485"/><polygon class="ah" points="737.5,485 733,477 742,477"/><text class="ta" x="200" y="456">YARP routes by path</text><g class="bx app"><rect x="80" y="485" width="175" height="56" rx="6"/><text class="tt" x="92" y="508">api (monolith)</text><text class="ts" x="92" y="526">internal · 1 to 5</text></g><g class="bx app"><rect x="270" y="485" width="175" height="56" rx="6"/><text class="tt" x="282" y="508">payment</text><text class="ts" x="282" y="526">internal · 1 replica</text></g><g class="bx app"><rect x="460" y="485" width="175" height="56" rx="6"/><text class="tt" x="472" y="508">delivery</text><text class="ts" x="472" y="526">internal · 1 replica</text></g><g class="bx app"><rect x="650" y="485" width="175" height="56" rx="6"/><text class="tt" x="662" y="508">restaurant</text><text class="ts" x="662" y="526">internal · 1 replica</text></g><path class="ar" d="M167.5 541 L167.5 560"/><path class="ar" d="M357.5 541 L357.5 560"/><path class="ar" d="M547.5 541 L547.5 560"/><path class="ar" d="M737.5 541 L737.5 560"/><path class="ar" d="M167.5 560 L737.5 560"/><path class="ar" d="M195 560 L195 580"/><polygon class="ah" points="195,580 190.5,572 199.5,572"/><path class="ar" d="M440 560 L440 580"/><polygon class="ah" points="440,580 435.5,572 444.5,572"/><path class="ar" d="M697 560 L697 580"/><polygon class="ah" points="697,580 692.5,572 701.5,572"/><g class="bx app"><rect x="80" y="580" width="230" height="56" rx="6"/><text class="tt" x="92" y="603">kafka · KRaft 3.8</text><text class="ts" x="92" y="621">TCP 9092 · 16 topics</text></g><g class="bx app"><rect x="325" y="580" width="230" height="56" rx="6"/><text class="tt" x="337" y="603">redis 7.2</text><text class="ts" x="337" y="621">TCP 6379 · no persistence</text></g><g class="bx app"><rect x="570" y="580" width="255" height="56" rx="6"/><text class="tt" x="582" y="603">otel-collector</text><text class="ts" x="582" y="621">OTLP in, Azure Monitor out</text></g><rect class="ct data" x="60" y="672" width="780" height="116" rx="10"/><text class="tl" x="74" y="692">snet-postgres · 10.40.2.0/24 · private access, no public endpoint</text><path class="ar" d="M80 513 L70 513 L70 744 L80 744"/><polygon class="ah" points="80,744 72,739.5 72,748.5"/><g class="bx data"><rect x="80" y="716" width="360" height="56" rx="6"/><text class="tt" x="92" y="739">Postgres Flexible Server 16 · B1ms</text><text class="ts" x="92" y="757">zone 1 · one database per service</text></g><g class="bx data"><rect x="455" y="716" width="370" height="56" rx="6"/><text class="tt" x="467" y="739">tadka · tadka_payment</text><text class="ts" x="467" y="757">tadka_delivery · tadka_restaurant</text></g><g class="bx gov"><rect x="880" y="310" width="260" height="56" rx="6"/><text class="tt" x="892" y="333">Container App secrets</text><text class="ts" x="892" y="351">DB password · RS256 key · PII key</text></g><g class="bx gov"><rect x="880" y="385" width="260" height="56" rx="6"/><text class="tt" x="892" y="408">Budget alert</text><text class="ts" x="892" y="426">1,000 · email at 50% and 100%</text></g><g class="bx ops"><rect x="880" y="580" width="260" height="56" rx="6"/><text class="tt" x="892" y="603">Application Insights</text><text class="ts" x="892" y="621">traces, metrics, logs</text></g><g class="bx ops"><rect x="880" y="652" width="260" height="56" rx="6"/><text class="tt" x="892" y="675">Log Analytics workspace</text><text class="ts" x="892" y="693">environment and app logs</text></g><g class="bx gov"><rect x="880" y="722" width="260" height="56" rx="6"/><text class="tt" x="892" y="745">Private DNS zone</text><text class="ts" x="892" y="763">linked to vnet-tadka</text></g><path class="ar" d="M825 608 L880 608"/><polygon class="ah" points="880,608 872,603.5 872,612.5"/><path class="ar" d="M1010 636 L1010 652"/><polygon class="ah" points="1010,652 1005.5,644 1014.5,644"/><path class="ar dash" d="M825 744 L855 744 L855 750 L880 750"/></svg>
