 796 L707 796 L707 806"/><polygon class="ah hot" points="707,806 702.5,798 711.5,798"/><g class="bx gov"><rect x="880" y="310" width="260" height="56" rx="6"/><text class="tt" x="892" y="333">Container App secrets</text><text class="ts" x="892" y="351">DB password · RS256 key · PII key</text></g><g class="bx gov"><rect x="880" y="385" width="260" height="56" rx="6"/><text class="tt" x="892" y="408">Budget alert</text><text class="ts" x="892" y="426">1,000 · email at 50% and 100%</text></g><g class="bx app ha opt"><rect x="880" y="460" width="260" height="56" rx="6"/><text class="tt" x="892" y="483">Azure Managed Redis (optional)</text><text class="ts" x="892" y="501">Balanced_B0 · comparison only</text></g><g class="bx ops"><rect x="880" y="580" width="260" height="56" rx="6"/><text class="tt" x="892" y="603">Application Insights</text><text class="ts" x="892" y="621">traces, metrics, logs</text></g><g class="bx ops"><rect x="880" y="652" width="260" height="56" rx="6"/><text class="tt" x="892" y="675">Log Analytics workspace</text><text class="ts" x="892" y="693">environment and app logs</text></g><g class="bx gov"><rect x="880" y="806" width="260" height="56" rx="6"/><text class="tt" x="892" y="829">Private DNS zone</text><text class="ts" x="892" y="847">linked to vnet-tadka</text></g><path class="ar" d="M825 608 L880 608"/><polygon class="ah" points="880,608 872,603.5 872,612.5"/><path class="ar" d="M1010 636 L1010 652"/><polygon class="ah" points="1010,652 1005.5,644 1014.5,644"/><path class="ar dash" d="M825 834 L855 834 L855 834 L880 834"/></svg>
