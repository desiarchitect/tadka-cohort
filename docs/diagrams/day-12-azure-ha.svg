<svg viewBox="0 0 1180 938" xmlns="http://www.w3.org/2000/svg" width="1180" height="938" role="img"><title>Tadka on Azure, ha mode</title><style>
svg{--plate:#ffffff;--fg:#17211c;--muted:#56655d;--line:#8d9a93;--edge:#5b45c9;--edge-bg:#eeeafd;--app:#0d7457;--app-bg:#e1f3ea;--data:#1d5ca8;--data-bg:#e5eefa;--ops:#6f6238;--ops-bg:#f2eedf;--gov:#59636b;--gov-bg:#eceff1;--ha:#c25f00;--ha-bg:#fff1e0}
@media (prefers-color-scheme: dark){svg{--plate:#18201b;--fg:#e3ebe6;--muted:#9db0a5;--line:#74867c;--edge:#b4a6ff;--edge-bg:#26213f;--app:#6fd6ae;--app-bg:#14302a;--data:#8dbcf5;--data-bg:#172840;--ops:#d9c98f;--ops-bg:#2d2a1b;--gov:#b6c0c7;--gov-bg:#252b2f;--ha:#ffad5c;--ha-bg:#3a2610}}
.bg{fill:var(--plate)}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.tt{font-size:13px;font-weight:600;fill:var(--fg)}.ts{font-size:11.5px;fill:var(--muted)}
.tl{font:500 12px "IBM Plex Mono",Consolas,monospace;fill:var(--muted)}.ta{font-size:11px;fill:var(--muted);font-style:italic}
.ct{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 4}.ct.edge{stroke:var(--edge)}.ct.app{stroke:var(--app)}.ct.data{stroke:var(--data)}
.bx rect{stroke-width:1.2}.ext rect{fill:var(--plate);stroke:var(--line)}.edge rect{fill:var(--edge-bg);stroke:var(--edge)}
.app rect{fill:var(--app-bg);stroke:var(--app)}.data rect{fill:var(--data-bg);stroke:var(--data)}.ops rect{fill:var(--ops-bg);stroke:var(--ops)}
.gov rect{fill:var(--gov-bg);stroke:var(--gov)}.ha rect{stroke:var(--ha);stroke-width:2.4}.opt rect{stroke-dasharray:4 3}
.ar{fill:none;stroke:var(--line);stroke-width:1.3}.ar.dash{stroke-dasharray:5 4}.ar.hot{stroke:var(--ha)}.ah{fill:var(--line)}.ah.hot{fill:var(--ha)}
